name: PLC engine tests
on:
  push:
    branches: [feature/v04-plc]
    paths: ['firmware/plc/**', 'firmware/Yarumo_X4_V04/**', '.github/workflows/plc-test.yml']
  pull_request:
    paths: ['firmware/plc/**', 'firmware/Yarumo_X4_V04/**', '.github/workflows/plc-test.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify engine copy
        run: cmp firmware/plc/YarumoPlc.h firmware/Yarumo_X4_V04/YarumoPlc.h
      - name: Compile and run engine tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Wno-misleading-indentation -pedantic -fsanitize=address,undefined -g firmware/plc/tests/test_plc.cpp -o /tmp/yarumo-plc-test
          /tmp/yarumo-plc-test
  esp32:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and JSON library
        run: |
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install ArduinoJson@7.4.2
      - name: Compile simulator (no embedded credentials)
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/Yarumo_X4_V04
